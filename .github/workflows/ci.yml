name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows self-hosted
    runs-on: [self-hosted, windows, x64, amep]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python runtime
        shell: pwsh
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 10), sys.version"
          python -m pip --version

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Compile
        run: python -m compileall -q src tests examples

      - name: Test
        run: python -m pytest
