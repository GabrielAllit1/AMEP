name: PR validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amep-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows PR validation
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify GitHub-hosted runtime
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"
          python --version
          python -c "import sys; assert sys.version_info >= (3, 10), sys.version"
          python -m pip --version

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,qa]'

      - name: Capture resolved environment
        shell: pwsh
        run: |
          python -m pip freeze --all | Sort-Object | Out-File -Encoding ascii .ci-environment.txt
          $hash = (Get-FileHash .ci-environment.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Resolved environment SHA256: $hash"

      - name: Compile
        run: python -m compileall -q src tests examples scripts

      - name: Ruff
        run: python -m ruff check src tests examples scripts

      - name: Type check
        run: python -m mypy src/amep1

      - name: Static security scan
        run: python -m bandit -q -r src/amep1

      - name: Verify assurance traceability and action pinning
        run: python scripts/verify_assurance_contract.py

      - name: Runtime dependency audit
        shell: pwsh
        run: |
          python -c "import importlib.metadata as m; print('numpy==' + m.version('numpy')); print('scipy==' + m.version('scipy'))" | Out-File -Encoding ascii .ci-runtime-requirements.txt
          python -m pip_audit -r .ci-runtime-requirements.txt --strict

      - name: Test with coverage
        run: python -m pytest --cov=amep1 --cov-report=term-missing --cov-report=xml --cov-fail-under=75

  required-context:
    name: Windows self-hosted
    needs: validate
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Preserve protected-branch status context
        shell: pwsh
        run: |
          if ("${{ needs.validate.result }}" -ne "success") {
            throw "Windows PR validation did not succeed: ${{ needs.validate.result }}"
          }
          Write-Host "Protected-branch compatibility status: Windows self-hosted"
          Write-Host "Execution occurred on GitHub-hosted Windows; no public PR code used the self-hosted runner."
