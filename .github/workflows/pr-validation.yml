name: PR intake safety

# Security boundary: public pull requests are inspected only from the trusted
# default-branch workflow definition. This workflow never checks out or executes
# pull-request code. Full validation on the repository-scoped self-hosted runner
# occurs only after changes are placed on a trusted repository branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: amep-pr-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  intake:
    name: Public PR intake safety
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Reject external control-plane edits
        if: github.event_name == 'pull_request_target'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $changed = @()
          $page = 1
          do {
            $uri = "https://api.github.com/repos/$env:BASE_REPO/pulls/$env:PR_NUMBER/files?per_page=100&page=$page"
            $batch = @(Invoke-RestMethod -Headers $headers -Uri $uri -Method Get)
            $changed += $batch | ForEach-Object { $_.filename }
            $page += 1
          } while ($batch.Count -eq 100)

          $critical = @(
            $changed | Where-Object {
              $_ -like ".github/workflows/*" -or
              $_ -eq ".github/CODEOWNERS" -or
              $_ -eq "scripts/verify_assurance_contract.py"
            }
          )

          if ($critical.Count -gt 0) {
            Write-Host "Critical CI control-plane files changed:"
            $critical | ForEach-Object { Write-Host " - $_" }
          }

          if ($env:HEAD_REPO -ne $env:BASE_REPO -and $critical.Count -gt 0) {
            throw "External fork pull requests may not modify AMEP CI control-plane files."
          }

      - name: Confirm no untrusted code execution
        shell: pwsh
        run: |
          Write-Host "PR intake safety gate passed."
          Write-Host "No pull-request code was checked out or executed by this workflow."
          Write-Host "The required Windows self-hosted check is produced only by trusted repository branch pushes."
