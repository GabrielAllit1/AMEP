[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amep1"
version = "0.2.0"
description = "EKF-centered resilient maritime PNT and autonomy-authority research for GNSS-degraded and GNSS-denied USV operation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Gabriel V. Allit" }
]
keywords = [
  "resilient-pnt",
  "gnss-denial",
  "maritime-autonomy",
  "usv",
  "extended-kalman-filter",
  "multisensor-fusion"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]
qa = [
  "bandit>=1.7",
  "cyclonedx-bom>=5.0",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest-cov>=5.0",
  "ruff>=0.8"
]
dev = [
  "pytest>=8.0",
  "bandit>=1.7",
  "cyclonedx-bom>=5.0",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pytest-cov>=5.0",
  "ruff>=0.8"
]

[project.urls]
Repository = "https://github.com/GabrielAllit1/AMEP"
Research = "https://doi.org/10.5281/zenodo.22561851"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
